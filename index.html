<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f5f0" />
    <title>Nexora.rh — Gestão de férias</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="auth-gate" class="auth-page" style="display: block;">
      <main class="auth-shell">
        <a class="brand auth-brand" href="index.html" aria-label="Nexora.rh">
          <span class="brand-mark">n.</span><span class="brand-name">nexora<span class="brand-dot">.rh</span></span>
        </a>

        <section id="access-choice" class="auth-panel">
          <p class="eyebrow">ESPAÇO DE TRABALHO</p>
          <h1>Escolhe a tua área</h1>
          <p class="page-subtitle">Entra como administrador ou como colaborador.</p>
          <p class="auth-error" id="setup-warning" role="alert" hidden></p>

          <div class="auth-form">
            <button class="primary-button auth-submit" type="button" data-access-profile="admin">Área do Administrador</button>
            <button class="primary-button auth-submit" type="button" data-access-profile="employee">Acesso dos Funcionários</button>
          </div>
        </section>

        <section id="login-panel" class="auth-panel" hidden>
          <p class="eyebrow">ACESSO</p>
          <h1 id="login-title">Área do Administrador</h1>
          <p id="login-subtitle" class="page-subtitle">Inicia sessão para gerir as férias.</p>

          <form id="login-form" class="auth-form">
            <input type="hidden" name="profile" id="profile" value="admin" />

            <div class="form-field">
              <label for="email">E-mail</label>
              <input class="form-control" id="email" name="email" type="email" autocomplete="username" required maxlength="190" />
            </div>

            <div class="form-field">
              <label for="password">Palavra-passe</label>
              <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required />
            </div>

            <p class="auth-error" id="auth-error" role="alert" hidden></p>
            <button class="primary-button auth-submit" id="login-submit" type="submit">Entrar</button>
          </form>

          <p class="auth-footnote"><button type="button" class="quiet-button" id="back-choice">Voltar à escolha</button></p>
        </section>

        <p class="auth-copyright">NEXORA.RH · GESTÃO DE FÉRIAS</p>
      </main>
    </div>

    <div id="app-shell" class="app-shell" hidden>
      <aside class="sidebar" id="sidebar">
        <a class="brand" href="index.html" aria-label="Nexora.rh, início">
          <span class="brand-mark">n.</span>
          <span class="brand-name">nexora<span class="brand-dot">.rh</span></span>
        </a>

        <div class="workspace-label">ESPAÇO DE TRABALHO</div>
        <button class="workspace-switch" type="button" data-action="open-workspace" aria-label="Abrir opções do espaço de trabalho">
          <span class="workspace-avatar" id="workspace-avatar">N</span>
          <span class="workspace-copy"><strong id="workspace-name">Nexona Area</strong><small id="workspace-plan">Plano Equipa</small></span>
          <span class="chevron">⌄</span>
        </button>

        <div class="nav-label">MENU</div>
        <nav class="main-nav" aria-label="Navegação principal">
          <button class="nav-item active" data-view="inicio"><span class="nav-icon">⌂</span>Visão geral</button>
          <button class="nav-item" data-view="calendario"><span class="nav-icon">▦</span>Calendário</button>
          <button class="nav-item" data-view="pedidos"><span class="nav-icon">▤</span>Pedidos <span class="nav-count" id="pending-count">0</span></button>
          <button class="nav-item" data-view="equipa"><span class="nav-icon">♧</span>Equipa</button>
        </nav>

        <div class="nav-label admin-label">GESTÃO</div>
        <nav class="main-nav" aria-label="Gestão">
          <button class="nav-item" data-view="administracao"><span class="nav-icon">⚙</span>Administração</button>
        </nav>

        <div class="sidebar-bottom">
          <button class="help-block" type="button" data-action="open-help">
            <span class="help-icon">?</span>
            <div><strong>Precisa de ajuda?</strong><small>Consulte o centro de apoio</small></div>
            <span class="help-arrow">↗</span>
          </button>
          <div class="profile-switch">
            <span class="avatar avatar-green" id="profile-avatar"></span>
            <span class="profile-copy"><strong id="profile-name"></strong><small id="profile-role"></small></span>
            <button class="logout-button" id="logout-button" type="button" title="Terminar sessão" aria-label="Terminar sessão">↪</button>
          </div>
        </div>
      </aside>

      <main class="main-area">
        <header class="topbar">
          <button class="mobile-menu" id="mobile-menu" aria-label="Abrir menu">☰</button>
          <div class="breadcrumbs"><span>Nexona Area</span><span class="crumb-slash">/</span><strong id="breadcrumb-current">Visão geral</strong></div>
          <div class="topbar-actions">
            <span class="today-label" id="today-label"></span>
            <button class="icon-button notification-button" id="notification-button" aria-label="Notificações"><span>♧</span><i></i></button>
            <span class="top-avatar" id="top-avatar" aria-hidden="true"></span>
          </div>
        </header>

        <div class="page-content" id="page-content"></div>
      </main>
    </div>

    <div class="toast-region" id="toast-region" aria-live="polite"></div>
    <div class="modal-layer" id="modal-layer" hidden></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script>
      const authGate = document.getElementById("auth-gate");
      const appShell = document.getElementById("app-shell");
      const accessChoice = document.getElementById("access-choice");
      const loginPanel = document.getElementById("login-panel");
      const loginTitle = document.getElementById("login-title");
      const loginSubtitle = document.getElementById("login-subtitle");
      const profileField = document.getElementById("profile");
      const backChoice = document.getElementById("back-choice");
      const loginForm = document.getElementById("login-form");
      const loginSubmit = document.getElementById("login-submit");
      const authError = document.getElementById("auth-error");
      const setupWarning = document.getElementById("setup-warning");
      const supabaseConfig = window.FOLGA_SUPABASE_CONFIG;
      const supabaseClient = window.supabase && supabaseConfig
        && !supabaseConfig.url.includes("YOUR_PROJECT")
        && !supabaseConfig.anonKey.includes("YOUR_SUPABASE")
        ? window.supabase.createClient(supabaseConfig.url, supabaseConfig.anonKey)
        : null;
      const DEMO_USERS = Object.freeze({
        "admin@folga.local": {
          id: "demo-admin",
          email: "admin@folga.local",
          name: "Administrador Nexora.rh",
          role: "Administrador",
          department: "Direção",
          annualLeaveDays: 22,
          hireDate: "2025-01-01",
          password: "admin123",
        },
        "funcionario@folga.local": {
          id: "demo-employee",
          email: "funcionario@folga.local",
          name: "Funcionário Teste",
          role: "Colaborador",
          department: "Operações",
          annualLeaveDays: 22,
          hireDate: "2025-01-01",
          password: "func123",
        },
      });

      function showAuthError(message) {
        authError.textContent = message;
        authError.hidden = false;
      }

      function getDemoProfile(user) {
        if (!user || !String(user.id || "").startsWith("demo-")) return null;
        const demoUser = DEMO_USERS[String(user.email || "").toLowerCase()];
        if (!demoUser) return null;
        return {
          id: demoUser.id,
          name: demoUser.name,
          email: demoUser.email,
          role: demoUser.role,
          department: demoUser.department || "Sem departamento",
          annualLeaveDays: demoUser.annualLeaveDays,
          hireDate: demoUser.hireDate,
        };
      }

      async function getProfile(user) {
        const demoProfile = getDemoProfile(user);
        if (demoProfile) return demoProfile;
        if (!supabaseClient) throw new Error("Falta configurar o projeto Supabase. Segue os passos do README.");
        const { data, error } = await supabaseClient
          .from("profiles")
          .select("id, full_name, role, department, job_title, hire_date, annual_leave_days")
          .eq("id", user.id)
          .single();
        if (error || !data) throw new Error("A conta não tem um perfil ativo. Contacta o administrador.");
        return {
          id: user.id,
          name: data.full_name,
          email: user.email,
          role: data.role,
          department: data.department || "Sem departamento",
          title: data.job_title || "Colaborador",
          hireDate: data.hire_date,
          annualLeaveDays: data.annual_leave_days,
        };
      }

      async function enterApp(user) {
        const userProfile = await getProfile(user);
        window.APP_USER = userProfile;
        window.FOLGA_SUPABASE = supabaseClient;
        if (String(user.id).startsWith("demo-")) {
          localStorage.setItem("folga-demo-session", JSON.stringify({ user: { id: user.id, email: user.email }, profile: userProfile.role }));
        } else {
          localStorage.removeItem("folga-demo-session");
        }
        authGate.hidden = true;
        appShell.hidden = false;
        if (!document.getElementById("app-script")) {
          const script = document.createElement("script");
          script.id = "app-script";
          script.src = "app.js?v=20261119";
          document.body.append(script);
        }
      }

      function showAccessChooser() {
        accessChoice.hidden = false;
        loginPanel.hidden = true;
      }

      function showLoginForm(profile) {
        const isAdmin = profile === "admin";
        loginTitle.textContent = isAdmin ? "Área do Administrador" : "Acesso dos Funcionários";
        loginSubtitle.textContent = isAdmin ? "Inicia sessão para gerir as férias da empresa." : "Inicia sessão para consultar e gerir as tuas férias.";
        profileField.value = profile;
        accessChoice.hidden = true;
        loginPanel.hidden = false;
      }

      document.querySelectorAll("[data-access-profile]").forEach((button) => {
        button.addEventListener("click", async () => {
          const profile = button.dataset.accessProfile;
          authError.hidden = true;
          setupWarning.hidden = true;
          showLoginForm(profile);
        });
      });

      loginForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        authError.hidden = true;

        loginSubmit.disabled = true;
        try {
          const formData = new FormData(loginForm);
          const email = String(formData.get("email") || "").trim().toLowerCase();
          const password = String(formData.get("password") || "").trim();
          const selectedProfile = profileField.value;
          const demoUser = Object.values(DEMO_USERS).find((item) => item.email.toLowerCase() === email) || DEMO_USERS[email];

          if (demoUser && demoUser.password === password) {
            await enterApp({ id: demoUser.id, email: demoUser.email, role: demoUser.role });
            return;
          }

          if (!supabaseClient) {
            throw new Error("Conta ou palavra-passe inválidas. Usa as contas de teste ou configura o Supabase.");
          }

          const { data, error } = await supabaseClient.auth.signInWithPassword({
            email,
            password,
          });
          if (error) throw new Error("E-mail ou palavra-passe incorretos.");

          const userProfile = await getProfile(data.user);
          const expectedRole = selectedProfile === "admin" ? "Administrador" : null;
          const isEmployee = ["Colaborador", "Responsável"].includes(userProfile.role);
          if ((expectedRole && userProfile.role !== expectedRole) || (!expectedRole && !isEmployee)) {
            await supabaseClient.auth.signOut();
            throw new Error("Esta conta não tem acesso à área selecionada.");
          }
          await enterApp(data.user);
        } catch (error) {
          showAuthError(error.message || "Não foi possível iniciar sessão.");
        } finally {
          loginSubmit.disabled = false;
        }
      });

      backChoice.addEventListener("click", () => {
        authError.hidden = true;
        showAccessChooser();
      });

      document.getElementById("logout-button").addEventListener("click", async () => {
        if (supabaseClient) {
          await supabaseClient.auth.signOut();
        }
        localStorage.removeItem("folga-demo-session");
        window.location.reload();
      });

      async function restoreSession() {
        const savedDemoSession = JSON.parse(localStorage.getItem("folga-demo-session") || "null");
        if (savedDemoSession && savedDemoSession.user) {
          try {
            await enterApp(savedDemoSession.user);
            return;
          } catch (error) {
            localStorage.removeItem("folga-demo-session");
          }
        }

        if (!supabaseClient) {
          setupWarning.textContent = "Como não há projeto Supabase ativo, usa as contas de teste em baixo.";
          setupWarning.hidden = false;
          return;
        }
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session) {
          try {
            await enterApp(session.user);
          } catch (error) {
            await supabaseClient.auth.signOut();
            showAccessChooser();
            setupWarning.textContent = error.message;
            setupWarning.hidden = false;
          }
        }
      }

      restoreSession().catch((error) => {
        showAccessChooser();
        showAuthError(error.message || "Não foi possível restaurar a sessão.");
      });
    </script>
  </body>
</html>
