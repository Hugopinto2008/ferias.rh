<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f6f3" />
    <title>Folga — Gestão de férias</title>
    <style>
      :root { color-scheme: light; font-family: "Segoe UI", sans-serif; color: #171b18; background: #f5f6f3; }
      * { box-sizing: border-box; }
      body { align-items: center; display: flex; justify-content: center; margin: 0; min-height: 100vh; padding: 24px; }
      main { background: #fff; border: 1px solid #e4e7e1; border-radius: 8px; max-width: 520px; padding: 32px; width: 100%; }
      .brand { align-items: center; color: #171b18; display: flex; font-size: 23px; font-weight: 800; gap: 10px; text-decoration: none; }
      .mark { align-items: center; background: #216747; border-radius: 10px 10px 10px 3px; color: #d7ed8d; display: inline-flex; height: 35px; justify-content: center; width: 35px; }
      .dot { color: #e5826a; }
      h1 { font-size: 22px; margin: 30px 0 10px; }
      p { color: #626b62; font-size: 14px; line-height: 1.6; }
      .status { color: #216747; font-size: 13px; font-weight: 600; }
      .actions { align-items: center; display: flex; flex-wrap: wrap; gap: 16px; margin-top: 24px; }
      button { background: #216747; border: 0; border-radius: 5px; color: #fff; cursor: pointer; font: inherit; font-size: 13px; font-weight: 700; padding: 11px 15px; }
      a.help { color: #216747; font-size: 13px; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main>
      <a class="brand" href="./" aria-label="Folga, início"><span class="mark">f.</span><span>folga<span class="dot">.</span></span></a>
      <h1 id="title">A verificar o serviço</h1>
      <p id="message" class="status" role="status" aria-live="polite">A ligar à aplicação…</p>
      <section id="actions" hidden>
        <div class="actions"><button id="retry" type="button">Tentar novamente</button><a class="help" href="README.md">Ver configuração do servidor</a></div>
      </section>
    </main>
    <script>
      const title = document.querySelector("#title");
      const message = document.querySelector("#message");
      const actions = document.querySelector("#actions");

      async function openApplication() {
        title.textContent = "A verificar o serviço";
        message.textContent = "A ligar à aplicação…";
        message.className = "status";
        actions.hidden = true;

        try {
          const response = await fetch("api/health.php", { cache: "no-store", headers: { Accept: "application/json" } });
          const result = await response.json();
          if (response.ok && result.status === "ok" && result.database === "connected") {
            window.location.replace("login.php");
            return;
          }

          title.textContent = "A base de dados não está disponível";
          message.textContent = "O servidor PHP respondeu, mas não conseguiu ligar ao MySQL. Inicia o MySQL no WampServer e confirma a configuração da base de dados.";
        } catch (error) {
          title.textContent = "Este alojamento não está a executar a aplicação";
          message.textContent = "O Folga precisa de PHP e MySQL para mostrar o login e proteger as contas. GitHub Pages e servidores estáticos não executam ficheiros PHP; usa o WampServer ou um alojamento com PHP/MySQL.";
        }

        message.className = "";
        actions.hidden = false;
      }

      document.querySelector("#retry").addEventListener("click", openApplication);
      openApplication();
    </script>
  </body>
</html>
